[EMC]
MACHINE = GROOT_EtherCAT
DEBUG = 0
VERSION = 1.1

[DISPLAY]
DISPLAY = probe_basic
CONFIRM_EXIT = False
LOG_FILE = lib/grootec.log
LOG_LEVEL = ERROR
PREFERENCE_FILE = sim.pref
CONFIG_FILE = lib/custom_config.yml
POSITION = 0x0
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL

MAX_FEED_OVERRIDE = 2.000000
MAX_RAPID_OVERRIDE = 1.00

MAX_SPINDLE_OVERRIDE = 2.000000
MIN_SPINDLE_OVERRIDE = 0.500000
DEFAULT_SPINDLE_SPEED = 6000
MAX_SPINDLE_0_SPEED = 24000

DEFAULT_LINEAR_VELOCITY = 125.00000
MAX_LINEAR_VELOCITY = 200.000000
MIN_LINEAR_VELOCITY = 0.500000

DEFAULT_ANGULAR_VELOCITY = 720.000000
MAX_ANGULAR_VELOCITY = 1800.000000
MIN_ANGULAR_VELOCITY = 1

PROGRAM_PREFIX = ~/linuxcnc/nc_files
INTRO_GRAPHIC = pbsplash.png
INTRO_TIME = 1
INCREMENTS = cont 1mm .1mm .01mm .001mm

GEOMETRY = xyza
#USER_TABS_PATH = user_tabs/
#USER_BUTTONS_PATH = user_buttons/
#USER_DROS_PATH = user_dro_display/
DRO_DISPLAY = XYZA
GEOMETRY = XYZA
OFFSET_COLUMNS = XYZA
TOOL_TABLE_COLUMNS = TZDR

KEYBOARD_JOG = true
KEYBOARD_JOG_SAFETY_OFF = true
# ATC tab display options, 0 = no atc tab displayed, 1 = Carousel atc display, 2 = rack atc display
ATC_TAB_DISPLAY = 0
#USER_ATC_BUTTONS_PATH = user_atc_buttons/

# File Paths:
#   File paths can be relative to the config dir:
#     LOG_FILE = qtpyvcp.log
#   Or relative to $HOME: (May not be compatible with other GUIs!)
#     LOG_FILE = ~/qtpyvcp.log
#   Or at an absolute location:
#     LOG_FILE = /home/<USER>/qtpyvcp.log
#   Enviroment vars are also expanded:
#     LOG_FILE = $CONFIG_DIR/qtpyvcp.log

[FILTER]
PROGRAM_EXTENSION = .nc,.txt,.tap Other NC files
PROGRAM_EXTENSION = .png,.gif,.jpg Greyscale Depth Image
    png = image-to-gcode
    gif = image-to-gcode
    jpg = image-to-gcode

[ATC]
# Carousel images are available for 8, 10, 12, 14, 16, 18, 20, 21, 24 pocket changers
POCKETS = 12
# The Z height your spindle needs to be at to clamp/unclamp a tool from the ATC platter
Z_TOOL_CHANGE_HEIGHT = -3.1900
# The Z clearance height in machine coordinates your spindle needs to be at to clear the tools during carousel rotation 
Z_TOOL_CLEARANCE_HEIGHT = 0.0000
# Step Time should be set to the approximate time it takes your ATC to rotate from one pocket to the next entry is in milliseconds(1 second = 1000ms)
# This just adjust the speed of the ATC tab Carousel GFX rotation (default if omitted is 1000ms)
STEP_TIME = 500

[RS274NGC]
RS274NGC_STARTUP_CODE = G17 G21 G40 G43H0 G54 G64P0.05 G80 G90 G94 G97
PARAMETER_FILE = linuxcnc.var
OWORD_NARGS = 1
NO_DOWNCASE_OWORD = 1
ON_ABORT_COMMAND = O<on_abort> CALL
REMAP=M6   modalgroup=6  prolog=change_prolog   ngc=atc_tctemp  epilog=change_epilog
FEATURES=30 
USER_M_PATH = ./m_codes/
PROGRAM_PREFIX = ~/linuxcnc/nc_files
SUBROUTINE_PATH = ./subroutines/

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
BASE_PERIOD = 100000
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[HAL]
HALUI = halui

#HALFILE = hallib/core_sim_5.hal
#HALFILE = hallib/simulated_home_probe_basic_5.hal
#HALFILE = hallib/spindle_sim.hal
#HALFILE = hallib/sim_cannon.hal

HALFILE                     = lib/realtimecomponents.hal
HALFILE                     = lib/io.hal
HALFILE                     = lib/axis.hal
HALFILE                     = lib/halui.hal
HALFILE                     = lib/spindle.hal
HALFILE                     = lib/atc.hal
HALFILE                     = lib/probe.hal
POSTGUI_HALFILE             = lib/postgui.hal
# Note: Postgui calls the following files at the beginning - this ensures that certain elements really are in place    
#       hallib/pendant_whb.hal
#       hallib/estop.hal
SHUTDOWN                    = lib/shutdown.hal

POSTGUI_HALFILE = hallib/probe_basic_postgui.hal
TWOPASS = on

[HALUI]
# Note: MDI Commands are numbered in the order they appear in INI 
# for whb starting at 00
MDI_COMMAND=(debug,macro0) # this one is for numbering but not used by pendant (need 1 to 16)
MDI_COMMAND=(debug,macro1)
MDI_COMMAND=(debug,macro2)
# Safe Z
MDI_COMMAND=G53G0Z0 
MDI_COMMAND=o<go_to_mtc> call 
MDI_COMMAND=G10 L20 P0 X0
MDI_COMMAND=G10 L20 P0 Y0
MDI_COMMAND=G10 L20 P0 Z0
MDI_COMMAND=o<pdnt_probe_z> call
MDI_COMMAND=(debug,macro9)
MDI_COMMAND=(debug,macro10)
MDI_COMMAND=(debug,macro11)
MDI_COMMAND=(debug,macro12)
MDI_COMMAND=(debug,macro13)
#14
MDI_COMMAND=o<go_to_home> call
MDI_COMMAND=(debug,macro15)
MDI_COMMAND=(debug,macro16)
# Commands for ATC and Spindle
#17 - trigger home
MDI_COMMAND = M13
MDI_COMMAND = M172

[TRAJ]
COORDINATES =  XYYZA
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
# This is the DEFAULT_LINEAR_VELOCITY for gmoccapy
DEFAULT_LINEAR_VELOCITY = 100
MAX_VELOCITY = 200
MAX_LINEAR_VELOCITY = 200
POSITION_FILE = position.txt
SPINDLES = 1

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl
TOOL_CHANGE_QUILL_UP = 1
RANDOM_TOOLCHANGER = 0 

[KINS]
JOINTS = 5
KINEMATICS = trivkins  coordinates=XYYZA 
kinstype = both


# ---------- AXIS X / JOINT 0 ----------
[AXIS_X]
MAX_VELOCITY                = 200
MAX_ACCELERATION            = 1000.0
MIN_LIMIT                   = -0.01
MAX_LIMIT                   = 672.0

[JOINT_0]
TYPE                        = LINEAR
HOME                        = 0.0
FERROR                      = 10.0
MIN_FERROR                  = 1.0
MAX_VELOCITY                = 200
MAX_ACCELERATION            = 1000.0
# PID
P                           = 20.0
I                           = 0.0
D                           = 0.0
FF0                         = 0.0
FF1                         = 1.0
FF2                         = 0.0
BIAS                        = 0.0
DEADBAND                    = 0.0
MAX_OUTPUT                  = 0.0
# Stepdown of axis using belt drive with pully ratio 56/44 
# A3 e-gear set to: 01-44: 1, 01-45: 1
# POS_SCALE = pitch*pulley (here 10*44) 
POS_SCALE                   = 440
# POS_SCALE = 16777216*pulley (here 16777216*56 939524096) 
SRV_PPREV                   = 939524096
# equal to resolution of linear scale (per machine unit, for metric: 1 mm)
EXTENC_SCALE                = 0.001

# Physical Axis Setup and Homing
MIN_LIMIT                   = -0.01
MAX_LIMIT                   = 672.0

HOME_OFFSET                 = -0.5
HOME_SEARCH_VEL             = -40.0
HOME_LATCH_VEL              = 2.5
HOME_FINAL_VEL              = 5
HOME_USE_INDEX              = NO
HOME_IGNORE_LIMITS          = YES
HOME_SEQUENCE               = 2

# ---------- AXIS Y / JOINT 1+2 ----------
[AXIS_Y]
MAX_VELOCITY                = 180
MAX_ACCELERATION            = 750.0
MIN_LIMIT                   = -0.01
MAX_LIMIT                   = 1254.0

[JOINT_1]
#  AXIS Y1 JOINT 1 U30 W2030 W2031 Front/Room
TYPE                        = LINEAR
HOME                        = 0.0
FERROR                      = 200.0
MIN_FERROR                  = 1.0
MAX_VELOCITY                = 180
MAX_ACCELERATION            = 750.0
# PID
P                           = 10.0
I                           = 0.0
D                           = 0.0
FF0                         = 0.0
FF1                         = 1.0
FF2                         = 0.0
BIAS                        = 0.0
DEADBAND                    = 0.0
MAX_OUTPUT                  = 0.0
# A3 e-gear set to: 01-44: 1, 01-45: 1
# POS_SCALE = pitch*pulley (here 10*1) 
POS_SCALE                   = 10
# POS_SCALE = 16777216*pulley (here 16777216*1) 
SRV_PPREV                   = 16777216
# equal to resolution of linear scale (per machine unit, for metric: 1 mm)
EXTENC_SCALE                = 0.001

# Physical Axis Setup and Homing
MIN_LIMIT                   = -0.01
MAX_LIMIT                   = 1254.0
# Change this value to square gantry:
# Note: Offset is the value to which after homing the internal coordinate is set
# wenn at x+ indicator value rises (moves towards ref square)  --> this number needs to be more negative 
# -0.1 base offset
HOME_OFFSET                 = -1.285
HOME_SEARCH_VEL             = -30.0
HOME_LATCH_VEL              = 0.500
HOME_FINAL_VEL              = 1.0
HOME_USE_INDEX              = NO
HOME_IGNORE_LIMITS          = YES
# Synchronize joints of tandem axis > Sequence -1 
HOME_SEQUENCE               = -1

#HOME_OFFSET                 = 0
#HOME_SEARCH_VEL             = 0
#HOME_LATCH_VEL              = 0
#HOME_USE_INDEX              = NO
#HOME_SEQUENCE               = 0


[JOINT_2]
#  AXIS Y2 JOINT 2 U40 W2040 W2041 Wall
TYPE                        = LINEAR
HOME                        = 0.0
FERROR                      = 200.0
MIN_FERROR                  = 1.0
MAX_VELOCITY                = 180
MAX_ACCELERATION            = 750.0
# PID
P                           = 10.0
I                           = 0.0
D                           = 0.0
FF0                         = 0.0
FF1                         = 1.0
FF2                         = 0.0
BIAS                        = 0.0
DEADBAND                    = 0.0
MAX_OUTPUT                  = 0.0
# A3 e-gear set to: 01-44: 1, 01-45: 1
# POS_SCALE = pitch*pulley (here 10*1) 
POS_SCALE                   = 10
# POS_SCALE = 16777216*pulley (here 16777216*1) 
SRV_PPREV                   = 16777216
# equal to resolution of linear scale (per machine unit, for metric: 1 mm)
EXTENC_SCALE                = 0.001

# Physical Axis Setup and Homing
MIN_LIMIT                   = -0.01
MAX_LIMIT                   = 1254.0
# Change this value to square gantry:
HOME_OFFSET                 = -0.1
HOME_SEARCH_VEL             = -30.0
HOME_LATCH_VEL              = 0.500
HOME_FINAL_VEL              = 1.0
HOME_USE_INDEX              = NO
HOME_IGNORE_LIMITS          = YES
# Synchronize joints of tandem axis > Sequence -1 
HOME_SEQUENCE               = -1



# ---------- AXIS Z / JOINT 3 ----------
[AXIS_Z]
MAX_VELOCITY                = 125
MAX_ACCELERATION            = 1250.0
MIN_LIMIT                   = -207.0
MAX_LIMIT                   = 0.01

[JOINT_3]
TYPE                        = LINEAR
HOME                        = 0.0
FERROR                      = 10.0
MIN_FERROR                  = 1.0
MAX_VELOCITY                = 125
MAX_ACCELERATION            = 1250.0
# PID
P                           = 20.0
I                           = 0.0
D                           = 0.0
FF0                         = 0.0
FF1                         = 1.0
FF2                         = 0.0
BIAS                        = 0.0
DEADBAND                    = 0.0
MAX_OUTPUT                  = 0.0
# Stepdown of axis using belt drive with pully ratio 52/40 
# A3 e-gear set to: 01-44: 1, 01-45: 1
# POS_SCALE = pitch*pulley (here 5*40) 
POS_SCALE                   = 200
# POS_SCALE = 16777216*pulley (here 16777216*52 872415323) 
SRV_PPREV                   = 872415323
# equal to resolution of linear scale (per machine unit, for metric: 1 mm)
EXTENC_SCALE                = 0.001
# Physical Axis Setup and Homing
MIN_LIMIT                   = -207.0
MAX_LIMIT                   = 0.01
# Homing
HOME_OFFSET                 = 1.5
HOME_SEARCH_VEL             = 25.0
HOME_LATCH_VEL              = 2.5
HOME_FINAL_VEL              = 5.0
HOME_USE_INDEX              = NO
HOME_IGNORE_LIMITS          = YES
# Lift up Z first -> Sequence 0
HOME_SEQUENCE               = 0
#
#HOME_OFFSET                 = 0
#HOME_SEARCH_VEL             = 0
#HOME_LATCH_VEL              = 0
#HOME_USE_INDEX              = NO
#HOME_SEQUENCE               = 0
#
#

# ---------- AXIS A / JOINT 4 ----------
[AXIS_A]
MAX_VELOCITY                = 400
MAX_ACCELERATION            = 5000.0
WRAPPED_ROTARY              = 0 

[JOINT_4]
TYPE                        = ANGULAR
HOME                        = 0.0
FERROR                      = 10.0
MIN_FERROR                  = 1.0
MAX_VELOCITY                = 400
MAX_ACCELERATION            = 5000.0
# PID
P                           = 20.0
I                           = 0.0
D                           = 0.0
FF0                         = 0.0
FF1                         = 1.0
FF2                         = 0.0
BIAS                        = 0.0
DEADBAND                    = 0.0
MAX_OUTPUT                  = 0.0
# A2 e-gear set to: 01-44: 1, 01-45: 1
# Gearbox i40
# POS_SCALE = Rotary joint = 360°  
POS_SCALE                   = 360
# POS_SCALE = 1280000*ratio (here 1 280 000 * 40 = 51 200 000) 
SRV_PPREV                   = 51200000
#1280000
# equal to resolution of linear scale (per machine unit, for metric: 1 mm)
EXTENC_SCALE                = 0.001
# Physical Axis Setup and Homing

HOME_SEARCH_VEL             = 50.0
HOME_LATCH_VEL              = 1
HOME_FINAL_VEL              = 1.0
HOME_USE_INDEX              = NO
HOME_OFFSET                 = -1
HOME_IGNORE_LIMITS          = YES
# Do A first -> Sequence 0
HOME_SEQUENCE               = 0


# ---------- SPINDLE ----------
[SPINDLE]
LIMITRPM_UPPER          = 24000
# Limits max reverse RPM (only used for tool measurement)
LIMITRPM_LOWER          = -300
# Scaling factor to adjust rpm request via EtherCAT
VELSCALE                = 0.1
# Times are to base freq in ms
RAMP_DOWN               = 8000
RAMP_UP                 = 8000

# ---------- Spindle NTC ----------
[NTC]
NTC_TEMP                    = 25.0
NTC_RES                     = 10000
NTC_BETA                    = 3950
NTC_MAX_TEMP                = 50.0
NTC_VOLTAGE                 = 24.23
VDIV_RES                    = 3250
#VDIV_RES actual 2350 --> offset to account for manual temp caibration
VDIV_REFSCALE               = 3.15  
# R1= 9837 R2 =19710 
# Factor unclear.. why is this off?


[TOOLSENSOR]
X = 632.9
Y = 25.7
Z = -10
# Maximum search distance and direction (signed) - relative off Z position
MAX_PROBE_DISTANCE =  -120
# Speed of movements while approaching TLS touch one
RAPID_SPEED = 400
# Speed of movements while approaching TLS touch two
SLOW_SPEED = 50
# Diameter of toolsetter pad 
TS_DIAMETER = 20
# The speed of the reverse rotation of the spindle when measuring the tool diameter
REV_ROTATION_SPEED = 300
# The negative Z value when using the reference tool (here: the spindle nose) - abs value - rough value
REF_TOOL = 185.0
RETRACT_DISTANCE = 2
# Tool number of the 3d Probe to be excluded from tool lenght measurement
PROBE_NO = 99
# ---------- Manual Tool Change (MTC) Position ----------
[MTC_POS]
X = 500
Y = 0
Z = 0

[MQL]
# Setup of Stepgen on Mesa Card for MQL
TYPE                        = ANGULAR
HOME                        = 0.0
FERROR                      = 10.0
MIN_FERROR                  = 1.0
MAX_VELOCITY                = 100
MAX_ACCELERATION            = 1200.0
# The values below should be 25% larger than MAX_VELOCITY and MAX_ACCELERATION
# If using BACKLASH compensation STEPGEN_MAXACCEL should be 100% larger.
STEPGEN_MAXVEL              = 125
STEPGEN_MAXACCEL            = 1500.00

# Timings for generic stepper driver
DIRSETUP                    = 5000
DIRHOLD                     = 5000
STEPLEN                     = 5000
STEPSPACE                   = 5000
# Stepper 800 mirosteps
STEP_SCALE                  = 800
# Factor to relate rpm to volume
SCALE                       = 0.01
SPITVOL                     = 150
MAXVOL                      = 175  